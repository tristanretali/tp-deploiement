name: CI/CD

on:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_app.py -v

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_e2e.py -v

  build-and-push:
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-deploiement:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-deploiement:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Azure VM
        env:
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_ADDRESS" bash -s <<EOF
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker pull $DOCKERHUB_USERNAME/tp-deploiement:latest
          docker stop tristanretali-app || true
          docker rm tristanretali-app || true
          docker run -d --name tristanretali-app --restart unless-stopped -p 8088:8080 $DOCKERHUB_USERNAME/tp-deploiement:latest
          sleep 3
          curl -f http://localhost:8088/health
          EOF
      - name: Verify the app is reachable via the public IP
        env:
          SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
        run: |
          HOST="${SSH_ADDRESS#*@}"
          curl -f --max-time 10 "http://$HOST:8088/health"
